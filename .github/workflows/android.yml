name: Android

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cache ncnn
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/third_party/ncnn
          key: ncnn-${{ hashFiles('scripts/setup-native.sh') }}

      - name: Fetch ncnn
        run: bash scripts/setup-native.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sharpr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache host ncnn
        id: ncnn
        uses: actions/cache@v4
        with:
          path: ~/ncnn-host
          key: ncnn-host-20260526-${{ runner.os }}

      - name: Build host ncnn (CPU)
        if: steps.ncnn.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 20260526 https://github.com/Tencent/ncnn /tmp/ncnn
          cmake -S /tmp/ncnn -B /tmp/ncnn/build -DCMAKE_BUILD_TYPE=Release -DNCNN_VULKAN=OFF \
            -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=$HOME/ncnn-host
          cmake --build /tmp/ncnn/build -j4 --target install

      - name: Run native core tests
        run: |
          cmake -S app/src/test/native -B build/native-test -Dncnn_DIR=$HOME/ncnn-host/lib/cmake/ncnn
          cmake --build build/native-test -j4
          mkdir -p build/native-out
          build/native-test/sharpr_native_tests app/src/main/assets/models build/native-out
