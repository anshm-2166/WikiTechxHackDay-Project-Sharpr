name: Android

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          for i in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.31.6" > /tmp/sdk.log && break
            tail -5 /tmp/sdk.log; sleep 10
          done
          ls "$ANDROID_HOME/ndk"

      - name: Cache ncnn
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/third_party/ncnn
          key: ncnn-${{ hashFiles('scripts/setup-native.sh') }}

      - name: Fetch ncnn
        run: bash scripts/setup-native.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sharpr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache host ncnn
        id: ncnn
        uses: actions/cache@v4
        with:
          path: ~/ncnn-host
          key: ncnn-host-20260526-${{ runner.os }}

      - name: Build host ncnn (CPU)
        if: steps.ncnn.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 20260526 https://github.com/Tencent/ncnn /tmp/ncnn
          cmake -S /tmp/ncnn -B /tmp/ncnn/build -DCMAKE_BUILD_TYPE=Release -DNCNN_VULKAN=OFF \
            -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=$HOME/ncnn-host
          cmake --build /tmp/ncnn/build -j4 --target install

      - name: Run native core tests
        run: |
          cmake -S app/src/test/native -B build/native-test -Dncnn_DIR=$HOME/ncnn-host/lib/cmake/ncnn
          cmake --build build/native-test -j4
          mkdir -p build/native-out
          build/native-test/sharpr_native_tests app/src/main/assets/models build/native-out

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          for i in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.31.6" > /tmp/sdk.log && break
            tail -5 /tmp/sdk.log; sleep 10
          done
          ls "$ANDROID_HOME/ndk"

      - name: Cache ncnn
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/third_party/ncnn
          key: ncnn-${{ hashFiles('scripts/setup-native.sh') }}

      - name: Fetch ncnn
        run: bash scripts/setup-native.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests and screenshot tour (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: bash scripts/ci-device-tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-output
          path: |
            build/screens
            build/instrument.txt
            build/logcat.txt
          if-no-files-found: ignore

      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -f build/instrument.txt ] || exit 0
          mkdir -p /tmp/pub && cp build/screens/*.png /tmp/pub/ 2>/dev/null || true
          cp build/instrument.txt build/logcat.txt /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          echo "Screenshots and device-test output for ${GITHUB_SHA}" > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
