name: Android

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cache ncnn
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/third_party/ncnn
          key: ncnn-${{ hashFiles('scripts/setup-native.sh') }}

      - name: Fetch ncnn
        run: bash scripts/setup-native.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sharpr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
